[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "urirun-connector-process-adapters"
version = "0.1.0"
description = "Docker Sandbox and Chrome DevTools Protocol (CDP) Process URI adapters (sandbox://, pypi://, browser://) for urirun."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Tom Sapletta" }]
dependencies = [
    "urirun>=0.4.14",
]

[project.entry-points."urirun.bindings"]
sandbox = "urirun_connector_process_adapters.core:sandbox_bindings"
browser = "urirun_connector_process_adapters.core:browser_bindings"

[tool.setuptools.packages.find]
include = ["urirun_connector_process_adapters*"]
